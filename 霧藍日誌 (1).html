<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>霧藍日誌</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap">
<style>
:root{--bg:#c3d3da;--card:rgba(244,248,249,.84);--ink:#4b5a63;--mut:#7d8f9b;--pri:#8aa3b2;--pri2:#5f7b8a;--acc:#c58b6e;--line:rgba(95,123,138,.2);--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1d272e;--card:rgba(38,52,62,.82);--ink:#e3eaee;--mut:#9fb2bf;--pri:#6f8a9b;--pri2:#a9c0cf;--acc:#e0a98c;--line:rgba(169,192,207,.22);--on:#14202a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1d272e;--card:rgba(38,52,62,.82);--ink:#e3eaee;--mut:#9fb2bf;--pri:#6f8a9b;--pri2:#a9c0cf;--acc:#e0a98c;--line:rgba(169,192,207,.22);--on:#14202a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
#bg{position:fixed;inset:0;background:center/cover no-repeat;pointer-events:none;z-index:0}
main,footer{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:20px}
main{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);grid-template-areas:"ban" "cal" "notes" "todo" "mid"}
footer{padding-top:0;display:grid;gap:16px}
@media(min-width:980px){main{grid-template-columns:minmax(0,1.12fr) minmax(0,1fr) minmax(250px,.58fr);grid-template-rows:minmax(210px,auto) auto;grid-template-areas:"ban notes todo" "cal mid todo"}}
.card{background:var(--card);border-radius:28px;padding:20px;backdrop-filter:blur(6px);min-width:0}
.slot{position:relative;overflow:hidden;border-radius:28px;border:2px solid rgba(255,255,255,.75);background:var(--card);min-height:0}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.addp{position:absolute;inset:0;width:100%;border:0;border-radius:0;color:var(--mut)}
.rm{position:absolute;top:10px;right:10px;background:rgba(30,45,55,.6);color:#fff;border:0;border-radius:50%;width:26px;height:26px;padding:0;line-height:1}
.rm:hover{background:rgba(30,45,55,.85)}
.a-ban{grid-area:ban;height:150px}.a-wide{height:130px}
.a-mid{grid-area:mid;display:flex;flex-direction:column;gap:16px;min-width:0}.a-sq{display:grid;grid-template-columns:1fr 1fr;gap:16px}.a-sq .slot{aspect-ratio:1}
.a-cal{grid-area:cal}.a-notes{grid-area:notes;max-height:360px;overflow:auto}.a-todo{grid-area:todo}
@media(min-width:980px){.a-ban{height:auto}.a-wide{height:auto;flex:1;min-height:150px}}
button,select,input{font:inherit;color:var(--ink)}
button{background:transparent;border:1px solid var(--line);border-radius:10px;padding:5px 12px;cursor:pointer}
button:hover{background:var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pri2);outline-offset:1px}
button.on{background:var(--pri2);color:var(--on);border-color:var(--pri2)}
input[type=text],input[type=time],select{background:rgba(255,255,255,.4);border:1px solid var(--line);border-radius:10px;padding:6px 9px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ttl{text-align:center;flex:1}
#mn{display:block;font:600 40px/1.15 "Dancing Script","Brush Script MT",cursive;color:var(--pri2)}
#yr{color:var(--mut);font-size:13px}
.tools{display:flex;justify-content:center;gap:8px;margin:8px 0 12px}
.nv{border:0;font-size:22px;padding:2px 12px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{text-align:center;font-weight:700;padding:6px 0}
.we{color:var(--acc)}
.day{min-height:58px;background:transparent;border:0;border-radius:14px;padding:4px;text-align:center;display:block;width:100%;overflow:hidden}
.week .day{min-height:240px;background:rgba(255,255,255,.3)}
.day.out{opacity:.4}
.day.sun .n{color:var(--acc)}
.day.sel{background:rgba(138,163,178,.3)}
.n{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:50%;font-size:15px}
.day.today .n{background:var(--pri2);color:var(--on)}
.dots{display:flex;justify-content:center;gap:3px;margin-top:3px;min-height:7px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.dots i.td{background:transparent;border:1.5px solid var(--mut)}
.chip{font-size:11px;line-height:1.35;margin-top:3px;padding:1px 4px;border-left:3px solid var(--c);background:rgba(138,163,178,.2);border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.meta{font-size:11px;color:var(--mut);margin-top:3px}
h2{font-size:16px;margin:0 0 10px}.c{text-align:center;font-size:18px;margin-bottom:2px}
.cap{text-align:center;color:var(--mut);font-size:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.row .t{flex:1;min-width:0;word-break:break-word}
.row .tm{color:var(--mut);font-size:13px;min-width:44px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.done .t{text-decoration:line-through;color:var(--mut)}
.x{border:0;padding:2px 8px;color:var(--mut)}
.add{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.add input[type=text]{flex:1;min-width:110px}
.empty{color:var(--mut);font-size:13px;padding:6px 0}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.ph div{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .rm{top:4px;right:4px}
.set{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;font-size:13px;color:var(--mut);padding:12px 20px}
input[type=range]{accent-color:var(--pri2);width:130px}
@media(max-width:560px){.day{min-height:50px}.week .day{min-height:200px}.chip{font-size:10px}#mn{font-size:34px}}
</style>
</head>
<body>
<div id="bg"></div>
<main>
 <section class="slot a-ban" data-i="0"></section>
 <section class="card a-cal">
  <div class="bar">
   <button class="nv" onclick="nav(-1)" aria-label="上一頁">‹</button>
   <div class="ttl"><span id="mn"></span><span id="yr"></span></div>
   <button class="nv" onclick="nav(1)" aria-label="下一頁">›</button>
  </div>
  <div class="tools">
   <button onclick="goToday()">今天</button>
   <button id="vm" onclick="setView('month')">月</button>
   <button id="vw" onclick="setView('week')">週</button>
  </div>
  <div id="cal"></div>
 </section>
 <section class="card a-notes" id="ev"></section>
 <div class="a-mid">
  <div class="a-sq"><div class="slot" data-i="1"></div><div class="slot" data-i="2"></div></div>
  <section class="slot a-wide" data-i="3"></section>
 </div>
 <section class="card a-todo" id="td"></section>
</main>
<footer>
 <section class="card" id="more" hidden></section>
 <section class="card set">
  <button onclick="document.getElementById('bgf').click()">上傳背景圖片</button>
  <label>背景透明度 <input id="op" type="range" min="0" max="100"></label>
  <button onclick="clearBg()">移除背景</button>
  <span id="st"></span>
 </section>
</footer>
<input id="bgf" type="file" accept="image/*" hidden>
<input id="pf" type="file" accept="image/*" multiple hidden onchange="addPh(this.files)">
<script>
const CATS={工作:'#6b8fa8',生活:'#8fae9b',學習:'#a99bbd',運動:'#d0a27a',其他:'#97a3ab'};
const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
const WD=['S','M','T','W','T','F','S'],WDC=['日','一','二','三','四','五','六'];
let S={events:{},todos:{},photos:{},bg:null,op:50,view:'month'};
try{Object.assign(S,JSON.parse(localStorage.getItem('cal')||'{}'))}catch(e){}
const $=s=>document.querySelector(s);
const k=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>{const a=s.split('-');return new Date(+a[0],a[1]-1,+a[2])};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byTime=(a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99');
let cur=new Date(),sel=k(cur);
let db=null,assets=null,base='',synced=false,lastCfg='';
const EMPTY='{"events":[],"todos":[],"photos":[]}',last={};
const src=p=>p.startsWith('data:')?p:'/_blob/'+p;
const u2b=u=>{const h=u.split(','),s=atob(h[1]),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return new Blob([a],{type:h[0].match(/:(.*?);/)[1]})};
const dayJ=x=>JSON.stringify({events:S.events[x]||[],todos:S.todos[x]||[],photos:S.photos[x]||[]});
const fail=()=>{$('#st').textContent='同步失敗，請稍後再試'};
function save(){
 if(!synced){try{localStorage.setItem('cal',JSON.stringify(S));$('#st').textContent='已儲存在此裝置'}catch(e){$('#st').textContent='儲存空間不足，請移除部分照片'}return}
 new Set([...Object.keys(S.events),...Object.keys(S.todos),...Object.keys(S.photos)]).forEach(x=>{const j=dayJ(x);if((last[x]??EMPTY)!==j){last[x]=j;db.doc(base+'/days/'+x).set(JSON.parse(j)).catch(fail)}});
 const c=JSON.stringify({bg:S.bg,op:S.op});if(c!==lastCfg){lastCfg=c;db.doc(base+'/cfg/main').set(JSON.parse(c)).catch(fail)}
 $('#st').textContent='已同步到雲端';
}
async function prep(f,max){const u=await shrink(f,max);if(!synced)return u;if(!assets){$('#st').textContent='此帳號無法上傳圖片到雲端';return null}try{return (await assets.upload(u2b(u))).id}catch(e){$('#st').textContent='圖片上傳失敗，請稍後再試';return null}}
const rmAsset=p=>{if(synced&&assets&&p&&!p.startsWith('data:'))assets.delete(p).catch(()=>{})};
async function initSync(){
 if(!window.claude||!claude.use)return;
 let d,u,id;
 try{[d,u]=await Promise.all([claude.use('db'),claude.use('user')]);id=u&&await u.id()}catch(e){return}
 if(!d||!id)return;
 try{assets=await claude.use('assets')}catch(e){}
 base='data/users/'+id;$('#st').textContent='雲端同步中…';
 let ds,cs;
 try{[ds,cs]=await Promise.all([d.collection(base+'/days').get(),d.doc(base+'/cfg/main').get()])}catch(e){$('#st').textContent='雲端暫時無法連線，資料先存在此裝置';return}
 db=d;const L={events:S.events,todos:S.todos,photos:S.photos,bg:S.bg};
 S.events={};S.todos={};S.photos={};
 ds.docs.forEach(x=>{const v=x.data()||{};S.events[x.id]=v.events||[];S.todos[x.id]=v.todos||[];S.photos[x.id]=v.photos||[];last[x.id]=dayJ(x.id)});
 const c=cs.exists?cs.data():null;
 if(c){S.bg=c.bg||null;S.op=c.op??50;lastCfg=JSON.stringify({bg:S.bg,op:S.op})}
 let ok=true;
 const un=(a,b)=>a.concat(b.filter(y=>!a.some(z=>z.id===y.id)));
 for(const x of new Set([...Object.keys(L.events),...Object.keys(L.todos),...Object.keys(L.photos)])){
  S.events[x]=un(S.events[x]||[],L.events[x]||[]);S.todos[x]=un(S.todos[x]||[],L.todos[x]||[]);
  for(const p of L.photos[x]||[]){if(!p.startsWith('data:'))continue;if(!assets){ok=false;continue}
   try{(S.photos[x]=S.photos[x]||[]).push((await assets.upload(u2b(p))).id)}catch(e){ok=false}}
 }
 if(!c&&L.bg&&L.bg.startsWith('data:')){if(assets){try{S.bg=(await assets.upload(u2b(L.bg))).id}catch(e){ok=false}}else ok=false}
 synced=true;if(ok)try{localStorage.removeItem('cal')}catch(e){}
 save();applyBg();render();
 db.collection(base+'/days').onSnapshot(snap=>{let ch=false;snap.docs.forEach(x=>{const v=x.data()||{},j=JSON.stringify({events:v.events||[],todos:v.todos||[],photos:v.photos||[]});if(j!==(last[x.id]??EMPTY)){last[x.id]=j;S.events[x.id]=v.events||[];S.todos[x.id]=v.todos||[];S.photos[x.id]=v.photos||[];ch=true}});if(ch)render()},()=>{$('#st').textContent='雲端連線中斷'});
 db.doc(base+'/cfg/main').onSnapshot(x=>{if(!x.exists)return;const v=x.data(),j=JSON.stringify({bg:v.bg||null,op:v.op??50});if(j!==lastCfg){lastCfg=j;S.bg=v.bg||null;S.op=v.op??50;applyBg()}},()=>{});
}
function applyBg(){$('#bg').style.backgroundImage=S.bg?'url('+src(S.bg)+')':'none';$('#bg').style.opacity=S.op/100;$('#op').value=S.op}
function render(){
 const wk=S.view==='week',td=k(new Date());
 $('#vm').className=wk?'':'on';$('#vw').className=wk?'on':'';
 let start,n;
 if(wk){start=new Date(cur);start.setDate(cur.getDate()-cur.getDay());n=7;
  const e=new Date(start);e.setDate(e.getDate()+6);
  $('#mn').textContent=(start.getMonth()+1)+'/'+start.getDate()+' – '+(e.getMonth()+1)+'/'+e.getDate();$('#yr').textContent=e.getFullYear()+' 年 · 週檢視';
 }else{const f=new Date(cur.getFullYear(),cur.getMonth(),1);start=new Date(f);start.setDate(1-f.getDay());n=42;
  $('#mn').textContent=MN[cur.getMonth()];$('#yr').textContent=cur.getFullYear()+' 年 '+(cur.getMonth()+1)+' 月'}
 let h='<div class="grid">'+WD.map((w,i)=>'<div class="wd'+(i%6?'':' we')+'">'+w+'</div>').join('')+'</div><div class="grid'+(wk?' week':'')+'">';
 for(let i=0;i<n;i++){
  const d=new Date(start);d.setDate(start.getDate()+i);const key=k(d);
  const ev=(S.events[key]||[]).slice().sort(byTime),open=(S.todos[key]||[]).filter(x=>!x.done).length,ph=(S.photos[key]||[]).length;
  h+='<button class="day'+(!wk&&d.getMonth()!==cur.getMonth()?' out':'')+(d.getDay()?'':' sun')+(key===td?' today':'')+(key===sel?' sel':'')+'" onclick="pick(\''+key+'\')"><span class="n">'+d.getDate()+'</span>';
  if(wk)h+=ev.map(e=>'<div class="chip" style="--c:'+CATS[e.cat]+'">'+(e.time?e.time+' ':'')+esc(e.t)+'</div>').join('')+((open||ph)?'<div class="meta">'+(open?'待辦 '+open:'')+(open&&ph?' · ':'')+(ph?'照片 '+ph:'')+'</div>':'');
  else h+='<div class="dots">'+ev.slice(0,4).map(e=>'<i style="--c:'+CATS[e.cat]+'"></i>').join('')+(open?'<i class="td"></i>':'')+'</div>';
  h+='</button>';
 }
 $('#cal').innerHTML=h+'</div>';
 evP();tdP();phs();
}
function evP(){
 const d=pd(sel),ev=(S.events[sel]||[]).slice().sort(byTime);
 $('#ev').innerHTML='<h2>'+(d.getMonth()+1)+' 月 '+d.getDate()+' 日（週'+WDC[d.getDay()]+'）行程</h2>'
 +'<div class="add"><input type="time" id="et" aria-label="時間"><select id="ec" aria-label="分類">'+Object.keys(CATS).map(c=>'<option>'+c+'</option>').join('')+'</select><input type="text" id="ex" placeholder="新增行程" onkeydown="if(event.key===\'Enter\')addEv()"><button onclick="addEv()">新增</button></div>'
 +(ev.length?ev.map(e=>'<div class="row"><span class="dot" style="--c:'+CATS[e.cat]+'"></span><span class="tm">'+(e.time||'全天')+'</span><span class="t">'+esc(e.t)+' <small style="color:var(--mut)">'+e.cat+'</small></span><button class="x" onclick="delEv('+e.id+')" aria-label="刪除行程">✕</button></div>').join(''):'<div class="empty">這天還沒有行程</div>');
}
function tdP(){
 const d=pd(sel),t=S.todos[sel]||[];
 $('#td').innerHTML='<h2 class="c">待辦清單</h2><div class="cap">'+(d.getMonth()+1)+'/'+d.getDate()+'</div>'
 +'<div class="add"><input type="text" id="tx" placeholder="新增待辦" onkeydown="if(event.key===\'Enter\')addTd()"><button onclick="addTd()">新增</button></div>'
 +(t.length?t.map(x=>'<div class="row'+(x.done?' done':'')+'"><input type="checkbox" '+(x.done?'checked':'')+' onchange="tgl('+x.id+')" aria-label="完成"><span class="t">'+esc(x.t)+'</span><button class="x" onclick="delTd('+x.id+')" aria-label="刪除待辦">✕</button></div>').join(''):'<div class="empty">沒有待辦事項</div>');
}
function phs(){
 const ph=S.photos[sel]||[],d=pd(sel);
 document.querySelectorAll('.slot').forEach(el=>{const i=+el.dataset.i,p=ph[i];
  el.innerHTML=p?'<img src="'+src(p)+'" alt="每日照片"><button class="rm" onclick="delPh('+i+')" aria-label="移除照片">✕</button>':'<button class="addp" onclick="$(\'#pf\').click()">＋ 新增 '+(d.getMonth()+1)+'/'+d.getDate()+' 照片</button>'});
 $('#more').hidden=ph.length<=4;
 $('#more').innerHTML=ph.length>4?'<h2>更多照片</h2><div class="ph">'+ph.slice(4).map((p,j)=>'<div><img src="'+src(p)+'" alt="每日照片"><button class="rm" onclick="delPh('+(j+4)+')" aria-label="移除照片">✕</button></div>').join('')+'</div>':'';
}
const id=()=>Date.now()+Math.floor(Math.random()*1000);
function addEv(){const t=$('#ex').value.trim();if(!t){$('#ex').focus();return}(S.events[sel]=S.events[sel]||[]).push({id:id(),t,time:$('#et').value,cat:$('#ec').value});save();render()}
function delEv(i){S.events[sel]=S.events[sel].filter(e=>e.id!==i);save();render()}
function addTd(){const t=$('#tx').value.trim();if(!t){$('#tx').focus();return}(S.todos[sel]=S.todos[sel]||[]).push({id:id(),t,done:false});save();render();$('#tx').focus()}
function tgl(i){const t=S.todos[sel].find(x=>x.id===i);t.done=!t.done;save();render()}
function delTd(i){S.todos[sel]=S.todos[sel].filter(x=>x.id!==i);save();render()}
function delPh(i){const p=S.photos[sel][i];S.photos[sel].splice(i,1);rmAsset(p);save();render()}
function shrink(f,max){return new Promise(r=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',.72))};im.src=u})}
async function addPh(fs){const day=sel;for(const f of fs){const p=await prep(f,900);if(p)(S.photos[day]=S.photos[day]||[]).push(p)}$('#pf').value='';save();render()}
$('#bgf').onchange=async e=>{const f=e.target.files[0];if(!f)return;const p=await prep(f,1600);e.target.value='';if(!p)return;rmAsset(S.bg);S.bg=p;applyBg();save()};
$('#op').oninput=e=>{S.op=+e.target.value;applyBg()};
$('#op').onchange=save;
function clearBg(){rmAsset(S.bg);S.bg=null;applyBg();save()}
function pick(key){sel=key;render()}
function nav(n){if(S.view==='week')cur.setDate(cur.getDate()+7*n);else cur=new Date(cur.getFullYear(),cur.getMonth()+n,1);render()}
function goToday(){cur=new Date();sel=k(cur);render()}
function setView(v){S.view=v;try{localStorage.setItem('calv',v)}catch(e){}render()}
try{S.view=localStorage.getItem('calv')||S.view}catch(e){}
applyBg();render();initSync();
</script>
</body>
</html>
