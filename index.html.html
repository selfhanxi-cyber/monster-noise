<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小怪獸安靜教室</title>
<style>
  :root {
    --mint:#bfe9d9;
    --mint-deep:#6fb9a7;
    --cream:#fff7e9;
    --ink:#24443e;
    --green:#2f8f72;
    --yellow:#f4c95d;
    --red:#e85d5d;
    --panel:rgba(255,255,255,.88);
  }
  * { box-sizing:border-box; }
  body {
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    background:linear-gradient(180deg,#fffaf0 0%,#eef9f5 100%);
    color:var(--ink);
    min-height:100vh;
  }
  .app {
    width:min(1180px,100%);
    margin:auto;
    padding:20px;
  }
  header {
    display:flex;
    gap:14px;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    margin-bottom:14px;
  }
  h1 {
    margin:0;
    font-size:clamp(24px,3vw,40px);
    letter-spacing:.04em;
  }
  .quiet-timer {
    background:white;
    border:2px solid #dcefe7;
    border-radius:20px;
    padding:12px 18px;
    min-width:220px;
    text-align:center;
    box-shadow:0 8px 24px rgba(48,100,84,.08);
  }
  .quiet-timer .label {
    font-size:14px;
    opacity:.7;
  }
  #timer {
    display:block;
    font-weight:800;
    font-variant-numeric:tabular-nums;
    font-size:clamp(26px,4vw,44px);
    color:var(--green);
    line-height:1.05;
    margin-top:3px;
  }
  .stage {
    background:rgba(255,255,255,.78);
    border:2px solid #e2f0ea;
    border-radius:28px;
    padding:clamp(16px,3vw,30px);
    display:grid;
    grid-template-columns:minmax(0,1.3fr) minmax(260px,.7fr);
    gap:24px;
    align-items:center;
    overflow:hidden;
  }
  .monster-area {
    position:relative;
    min-width:0;
  }
  .monster-wrap {
    position:relative;
    width:min(650px,100%);
    margin:auto;
  }
  #monster {
    display:block;
    width:100%;
    height:auto;
    border-radius:24px;
    transition:transform .18s ease, filter .18s ease;
  }
  .sleep-mask {
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:0;
    transition:opacity .2s ease;
  }
  .state-quiet .sleep-mask { opacity:1; }
  .lid {
    position:absolute;
    width:18%;
    height:14%;
    background:
      radial-gradient(circle at 50% 45%, #c8eadf 0%, #bfe9d9 62%, #b7e2d4 100%);
    border-radius:50%;
    box-shadow:0 0 0 2px rgba(191,233,217,.18);
  }
  .lid::after {
    content:"";
    position:absolute;
    left:18%;
    right:18%;
    top:54%;
    height:18%;
    border-bottom:7px solid rgba(36,68,62,.78);
    border-radius:0 0 70% 70%;
  }
  .lid.left { left:29.3%; top:27.2%; transform:rotate(-6deg); }
  .lid.right { left:54.0%; top:30.3%; transform:rotate(6deg); }
  .zzz {
    position:absolute;
    right:7%;
    top:7%;
    font-weight:900;
    font-size:clamp(24px,4vw,52px);
    color:#6a8ed6;
    transform:rotate(-8deg);
    text-shadow:0 3px 0 white;
  }
  .state-talk #monster { transform:scale(1.015); }
  .state-loud #monster, .state-veryloud #monster { animation:shake .22s linear infinite alternate; filter:saturate(1.08); }
  @keyframes shake {
    from { transform:translateX(-3px) rotate(-.4deg) scale(1.02); }
    to   { transform:translateX(3px) rotate(.4deg) scale(1.02); }
  }
  @media (prefers-reduced-motion:reduce) {
    .state-loud #monster { animation:none; }
  }
  .bubble {
    position:relative;
    background:white;
    border:4px solid var(--mint-deep);
    border-radius:26px;
    padding:22px 20px;
    text-align:center;
    min-height:150px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    box-shadow:0 10px 30px rgba(48,100,84,.10);
  }
  .bubble:before {
    content:"";
    position:absolute;
    left:-26px;
    top:50%;
    width:34px;
    height:34px;
    background:white;
    border-left:4px solid var(--mint-deep);
    border-bottom:4px solid var(--mint-deep);
    transform:translateY(-50%) rotate(45deg);
  }
  #message {
    font-weight:900;
    line-height:1.3;
    font-size:clamp(27px,4vw,48px);
  }
  #submessage {
    margin-top:8px;
    font-size:15px;
    opacity:.72;
  }
  .state-talk .bubble {
    border-color:var(--yellow);
    background:#fffdf4;
  }
  .state-talk .bubble:before {
    border-color:var(--yellow);
    background:#fffdf4;
  }
  .state-loud .bubble, .state-veryloud .bubble {
    border-color:var(--red);
    background:#fff5f5;
  }
  .state-loud .bubble:before, .state-veryloud .bubble:before {
    border-color:var(--red);
    background:#fff5f5;
  }
  .controls {
    margin-top:16px;
    background:var(--panel);
    border:1px solid #dceae5;
    border-radius:22px;
    padding:16px;
    display:grid;
    grid-template-columns:auto minmax(220px,1fr) minmax(180px,.7fr);
    gap:18px;
    align-items:center;
  }
  button {
    border:0;
    border-radius:16px;
    padding:13px 18px;
    font-size:17px;
    font-weight:800;
    cursor:pointer;
    min-height:48px;
  }
  #micBtn { background:var(--green); color:white; }
  #micBtn.stop { background:#5b6f69; }
  .slider-group label, .meter-group label {
    display:flex;
    justify-content:space-between;
    gap:10px;
    font-weight:700;
    margin-bottom:8px;
  }
  input[type=range] { width:100%; min-height:34px; }
  .meter {
    height:20px;
    border-radius:999px;
    background:#e7efec;
    overflow:hidden;
    border:1px solid #d7e2de;
  }
  #meterBar {
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#6cc39d 0%,#f2c14d 63%,#e95f5f 84%);
    transition:width .08s linear;
  }
  .status {
    margin-top:10px;
    text-align:center;
    font-size:14px;
    color:#60766f;
  }
  .tip {
    margin-top:12px;
    padding:11px 14px;
    border-radius:14px;
    background:#f8fbfa;
    color:#536a62;
    font-size:14px;
  }
  @media (max-width:780px) {
    .stage { grid-template-columns:1fr; }
    .bubble:before {
      left:50%;
      top:-20px;
      transform:translateX(-50%) rotate(135deg);
    }
    .controls { grid-template-columns:1fr; }
    .quiet-timer { width:100%; }
  }
</style>
</head>

      <div style="font-size:13px;opacity:.65">數字越大，越容易偵測到說話聲。</div>
    </div>

    <div class="meter-group">
      <label>
        <span>目前音量</span>
        <strong id="levelText">0%</strong>
      </label>
      <div class="meter" aria-hidden="true"><div id="meterBar"></div></div>
    </div>
  </section>

  <div class="status" id="status">尚未開啟麥克風。</div>
<div class="status" id="diagnostic" style="margin-top:6px;font-weight:700"></div>
  <div class="tip">第一次使用時，瀏覽器會詢問麥克風權限。建議先在空教室調整「靈敏度」，讓一般環境聲不會吵醒小怪獸，而學生說話時能穩定觸發。</div>
</main>

<script>
(() => {
  const app = document.getElementById('app');
  const micBtn = document.getElementById('micBtn');
  const sensitivity = document.getElementById('sensitivity');
  const sensValue = document.getElementById('sensValue');
  const meterBar = document.getElementById('meterBar');
  const levelText = document.getElementById('levelText');
  const message = document.getElementById('message');
  const submessage = document.getElementById('submessage');
  const timerEl = document.getElementById('timer');
  const status = document.getElementById('status');

  let audioContext = null;
  let analyser = null;
  let source = null;
  let stream = null;
  let raf = null;
  let running = false;
  let quietStart = performance.now();
  let lastNoisy = 0;
  let smoothed = 0;

  function thresholds() {
    const s = Number(sensitivity.value);
    // 靈敏度越高，觸發門檻越低
    const talk = 0.055 - (s - 1) * 0.0042;
    const loud = talk * 2.15;
    return { talk: Math.max(0.012, talk), loud: Math.max(0.028, loud) };
  }

  function setState(state) {
    app.classList.remove('state-quiet','state-talk','state-loud','state-veryloud');
    app.classList.add('state-' + state);

    if (state === 'quiet') {
      message.textContent = '噓……我在睡覺 😴';
      submessage.textContent = '保持安靜，右上角會持續計時。';

    } else if (state === 'talk') {
      message.textContent = '不可以說話ㄡ';
      submessage.textContent = '小怪獸醒來了，安靜計時重新開始。';

    } else if (state === 'veryloud') {
      message.textContent = '🚨 太大聲了！全班立刻安靜！';
      submessage.textContent = '音量已經超過 70%';

    } else {
      message.textContent = '不要講話！！';
      submessage.textContent = '音量太大了，請立刻降低音量。';
    }
  }

  function resetQuietTimer() {
    quietStart = performance.now();
  }

  function updateTimer(now) {
    const elapsed = Math.max(0, now - quietStart);
    const totalTenths = Math.floor(elapsed / 100);
    const mins = Math.floor(totalTenths / 600);
    const secs = Math.floor((totalTenths % 600) / 10);
    const tenth = totalTenths % 10;
    timerEl.textContent =
      String(mins).padStart(2,'0') + ':' +
      String(secs).padStart(2,'0') + '.' + tenth;
  }

  function audioLoop(now) {
    if (!running || !analyser) return;

    const data = new Float32Array(analyser.fftSize);
    analyser.getFloatTimeDomainData(data);

    let sum = 0;
    for (let i = 0; i < data.length; i++) sum += data[i] * data[i];
    const rms = Math.sqrt(sum / data.length);

    smoothed = smoothed * 0.72 + rms * 0.28;
    const {talk, loud} = thresholds();

    const display = Math.min(100, Math.round((smoothed / (loud * 1.25)) * 100));
    meterBar.style.width = display + '%';
    levelText.textContent = display + '%';

    if (display >= 70) {
      setState('veryloud');
      lastNoisy = now;
      resetQuietTimer();

    } else if (display >= 10) {
      setState('loud');
      lastNoisy = now;
      resetQuietTimer();

    } else if (smoothed >= talk) {
      setState('talk');
      lastNoisy = now;
      resetQuietTimer();

    } else {
      // 稍微延遲回睡，避免畫面快速閃爍
      if (now - lastNoisy > 700) {
        setState('quiet');
        updateTimer(now);
      } else {
        resetQuietTimer();
      }
    }

    raf = requestAnimationFrame(audioLoop);
  }

  function updateDiagnostic() {
    const secure = window.isSecureContext;
    const hasMedia = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
    const diag = document.getElementById('diagnostic');

    if (!secure) {
      diag.textContent = '⚠️ 目前不是安全網址環境：麥克風可能會被瀏覽器封鎖。請用 HTTPS 網址開啟。';
      diag.style.color = '#b25b35';
    } else if (!hasMedia) {
      diag.textContent = '⚠️ 此瀏覽器目前無法使用麥克風 API。';
      diag.style.color = '#b25b35';
    } else {
      diag.textContent = '✅ 瀏覽器環境可使用麥克風，按下「開始偵測音量」後請允許權限。';
      diag.style.color = '#2f8f72';
    }
  }

  async function startMic() {
    updateDiagnostic();

    if (!window.isSecureContext) {
      status.textContent = '目前不是 HTTPS 安全環境，所以瀏覽器可能不允許麥克風。';
      return;
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      status.textContent = '這個瀏覽器不支援麥克風偵測，請改用最新版 Chrome、Edge 或 Safari。';
      return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false
        }
      });
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 2048;
      analyser.smoothingTimeConstant = 0.4;
      source = audioContext.createMediaStreamSource(stream);
      source.connect(analyser);

      running = true;
      quietStart = performance.now();
      lastNoisy = 0;
      micBtn.textContent = '⏹ 停止偵測';
      micBtn.classList.add('stop');
      status.textContent = '麥克風偵測中。請依教室環境調整靈敏度。';
      raf = requestAnimationFrame(audioLoop);
    } catch (err) {
      let msg = '無法使用麥克風。';
      if (err && err.name === 'NotAllowedError') {
        msg += ' 瀏覽器沒有取得麥克風權限，請到網址列／網站設定中允許麥克風。';
      } else if (err && err.name === 'NotFoundError') {
        msg += ' 找不到可用的麥克風裝置。';
      } else if (err && err.name === 'NotReadableError') {
        msg += ' 麥克風可能正被其他程式占用。';
      } else {
        msg += ' 請確認使用 HTTPS 網址，並允許瀏覽器使用麥克風。';
      }
      status.textContent = msg;
      console.error(err);
    }
  }

  async function stopMic() {
    running = false;
    if (raf) cancelAnimationFrame(raf);
    raf = null;
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null;
    if (audioContext) await audioContext.close().catch(() => {});
    audioContext = null;
    analyser = null;
    source = null;
    smoothed = 0;
    meterBar.style.width = '0%';
    levelText.textContent = '0%';
    micBtn.textContent = '🎤 開始偵測音量';
    micBtn.classList.remove('stop');
    setState('quiet');
    quietStart = performance.now();
    timerEl.textContent = '00:00.0';
    status.textContent = '已停止麥克風偵測。';
  }

  micBtn.addEventListener('click', () => running ? stopMic() : startMic());
  sensitivity.addEventListener('input', () => {
    sensValue.textContent = sensitivity.value;
  });

  // 尚未開啟麥克風時，不讓假計時一直跑
  setState('quiet');
  updateDiagnostic();
})();
</script>
</body>
</html>
